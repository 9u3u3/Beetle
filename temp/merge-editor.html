<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merge Editor</title>
    <link href="./merge-editor.css" rel="stylesheet">
</head>

<body>
    <div class="merge-container">
        <!-- Toolbar -->
        <div class="merge-toolbar">
            <span class="merge-title" id="merge-filename">Resolving Conflict</span>
            <div class="merge-actions">
                <button class="merge-btn accept-current" onclick="window.acceptCurrent()">
                    ✓ Accept Current
                </button>
                <button class="merge-btn accept-incoming" onclick="window.acceptIncoming()">
                    ✓ Accept Incoming
                </button>
                <button class="merge-btn accept-both" onclick="window.acceptBoth()">
                    ⊕ Accept Both
                </button>
                <button class="merge-btn save-btn" onclick="window.saveMerge()">
                    💾 Save
                </button>
            </div>
        </div>

        <!-- Current (HEAD) Section - Read Only -->
        <div class="merge-section current-section">
            <div class="merge-header current-header">
                <span class="merge-label">Current (HEAD)</span>
            </div>
            <div id="current-editor" class="merge-editor"></div>
        </div>

        <!-- Merged Result Section - Editable -->
        <div class="merge-section result-section">
            <div class="merge-header result-header">
                <span class="merge-label">Merged Result (Edit here)</span>
            </div>
            <div id="result-editor" class="merge-editor"></div>
        </div>

        <!-- Incoming Section - Read Only -->
        <div class="merge-section incoming-section">
            <div class="merge-header incoming-header">
                <span class="merge-label">Incoming Changes</span>
            </div>
            <div id="incoming-editor" class="merge-editor"></div>
        </div>
    </div>
    <script src="./merge-editor.bundle.js"></script>
</body>

</html>
