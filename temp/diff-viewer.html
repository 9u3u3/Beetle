<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diff Viewer</title>
  <link href="./diff-viewer.css" rel="stylesheet">
</head>
<body>
  <div class="diff-container">
    <!-- Current (HEAD) Section -->
    <div class="diff-section current-section">
      <div class="diff-header">
        <span class="diff-label">Current (HEAD)</span>
        <span class="diff-filename" id="current-filename"></span>
      </div>
      <div id="current-editor" class="diff-editor"></div>
    </div>

    <!-- Divider -->
    <div class="diff-divider"></div>

    <!-- Incoming Section -->
    <div class="diff-section incoming-section">
      <div class="diff-header">
        <span class="diff-label">Incoming Changes</span>
        <span class="diff-filename" id="incoming-filename"></span>
      </div>
      <div id="incoming-editor" class="diff-editor"></div>
    </div>
  </div>
  <script src="./diff-viewer.bundle.js"></script>
</body>
</html>
