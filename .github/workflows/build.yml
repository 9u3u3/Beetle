name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The CodeMirror bundles are gitignored, so a clean checkout has no editor until
      # Rollup runs. Without this step the APK builds but the editor WebView loads nothing.
      - name: Build web assets
        run: |
          npm ci
          npm start

      - name: Verify bundles were produced
        run: |
          for f in \
            app/src/main/assets/editor/editor.bundle.js \
            app/src/main/assets/editor/notebook.bundle.js
          do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty after 'npm start'"
              exit 1
            fi
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Runs R8 with the keep rules in proguard-rules.pro. Catches a shrink-time regression
      # (missing rule, unresolved reference) on the commit that introduced it rather than at
      # release time. Signing credentials are absent in CI, so this produces an unsigned APK.
      - name: Assemble release (R8 shrink)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beetle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
