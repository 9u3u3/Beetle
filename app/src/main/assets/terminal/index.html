<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Tenebrio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
        }

        #scroll-wrapper {
            width: 100%;
            min-height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #terminal {
            width: 100%;
            height: 100vh;
        }

        /* Spacer for portrait mode - allows scrolling terminal above keyboard */
        #scroll-spacer {
            width: 100%;
            height: 0;
            background: black;
        }

        /* In portrait mode, add scroll space */
        @media (orientation: portrait) {
            #scroll-spacer {
                height: 50vh;
            }
        }
    </style>
</head>

<body>
    <div id="scroll-wrapper">
        <div id="terminal"></div>
        <div id="scroll-spacer"></div>
    </div>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script src="term.js"></script>
</body>

</html>
